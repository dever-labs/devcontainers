name: Build Dev Container Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build (e.g. dotnet-dev). Leave blank to build all."
        required: false

env:
  REGISTRY: ghcr.io
  ORG: dever-labs

jobs:
  # Publish devcontainer features to GHCR before building images that reference them.
  publish-features:
    name: Publish features
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish features
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1
        with:
          publish-features: true
          base-path-to-features: features/src
          generate-docs: true
          oci-registry: ${{ env.REGISTRY }}
          features-namespace: ${{ env.ORG }}/devcontainer-features

  # Detect which image directories changed so we only rebuild what's needed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Detect changed images
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.image }}"
            if [ -n "$INPUT" ]; then
              IMAGES=$(echo "$INPUT" | jq -R -c '[.]')
            else
              IMAGES=$(find images -maxdepth 2 -name "devcontainer.json" | sed 's|images/||;s|/devcontainer.json||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          else
            # On push to main or a version tag, rebuild all images
            IMAGES=$(find images -maxdepth 2 -name "devcontainer.json" | sed 's|images/||;s|/devcontainer.json||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "images=$IMAGES" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    needs: [changes, publish-features]
    if: ${{ needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one image failing should not cancel the others
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine arch-specific image tags
        id: tags
        run: |
          ARCH="${{ matrix.platform }}"
          ARCH="${ARCH#linux/}"
          TAGS="latest-${ARCH}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            # Strip leading 'v' to split semver parts
            V="${VERSION#v}"
            MAJOR="v${V%%.*}"
            MINOR_REST="${V#*.}"
            MINOR="v${V%%.*}.${MINOR_REST%%.*}"
            # Always add the full version tag
            TAGS="${TAGS},${VERSION}-${ARCH}"
            # Add minor tag only if it differs from full version (i.e., has patch)
            if [[ "$MINOR" != "$VERSION" && "$MINOR" != "v$V" ]]; then
              TAGS="${TAGS},${MINOR}-${ARCH}"
            fi
            # Add major tag only if it differs from minor
            if [[ "$MAJOR" != "$MINOR" && "$MAJOR" != "$VERSION" ]]; then
              TAGS="${TAGS},${MAJOR}-${ARCH}"
            fi
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.image }}
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: images/${{ matrix.image }}/devcontainer.json
          imageName: ${{ env.REGISTRY }}/${{ env.ORG }}/devcontainers/${{ matrix.image }}
          imageTag: ${{ steps.tags.outputs.tags }}
          cacheFrom: ${{ env.REGISTRY }}/${{ env.ORG }}/devcontainers/${{ matrix.image }}
          platform: ${{ matrix.platform }}
          push: always

  manifest:
    name: Publish multi-arch manifest (${{ matrix.image }})
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.ORG }}/devcontainers/${{ matrix.image }}"
          if docker buildx imagetools inspect "${IMAGE}:latest-amd64" &>/dev/null \
            && docker buildx imagetools inspect "${IMAGE}:latest-arm64" &>/dev/null; then
            docker buildx imagetools create \
              -t "${IMAGE}:latest" \
              "${IMAGE}:latest-amd64" \
              "${IMAGE}:latest-arm64"
          else
            echo "Skipping manifest for ${{ matrix.image }}: one or both arch builds are missing"
          fi

      - name: Create version manifests
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.ORG }}/devcontainers/${{ matrix.image }}"
          VERSION="${{ github.ref_name }}"
          V="${VERSION#v}"
          MAJOR="v${V%%.*}"
          MINOR_REST="${V#*.}"
          MINOR="v${V%%.*}.${MINOR_REST%%.*}"

          # Only publish if both arch images exist
          if ! docker buildx imagetools inspect "${IMAGE}:${VERSION}-amd64" &>/dev/null \
            || ! docker buildx imagetools inspect "${IMAGE}:${VERSION}-arm64" &>/dev/null; then
            echo "Skipping version manifests for ${{ matrix.image }}: one or both arch builds are missing"
            exit 0
          fi

          # Always publish the full version tag
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          # Publish minor tag (v1.2) if it differs from full (v1.2.3)
          if [[ "$MINOR" != "$VERSION" && "$MINOR" != "v$V" ]]; then
            docker buildx imagetools create \
              -t "${IMAGE}:${MINOR}" \
              "${IMAGE}:${MINOR}-amd64" \
              "${IMAGE}:${MINOR}-arm64"
          fi

          # Publish major tag (v1) if it differs from minor
          if [[ "$MAJOR" != "$MINOR" && "$MAJOR" != "$VERSION" ]]; then
            docker buildx imagetools create \
              -t "${IMAGE}:${MAJOR}" \
              "${IMAGE}:${MAJOR}-amd64" \
              "${IMAGE}:${MAJOR}-arm64"
          fi
