name: Build Dev Container Images

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Weekly rebuild of every image to pick up base-image and OS security updates
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build (e.g. dotnet-dev). Leave blank to build all."
        required: false

env:
  REGISTRY: ghcr.io
  ORG: dever-labs

jobs:
  # Publish features first so images that reference them never build against a stale/missing feature.
  features:
    name: Publish features
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainers CLI
        run: npm install -g @devcontainers/cli

      - name: Publish features
        run: |
          devcontainer features publish \
            --registry ${{ env.REGISTRY }} \
            --namespace ${{ env.ORG }}/devcontainers/features \
            ./features/src

  # Detect which image directories changed so we only rebuild what's needed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
      stamp: ${{ steps.detect.outputs.stamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed images
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.image }}"
            if [ -n "$INPUT" ]; then
              IMAGES=$(echo "$INPUT" | jq -R -c '[.]')
            else
              IMAGES=$(find images -maxdepth 2 -name "devcontainer.json" | sed 's|images/||;s|/devcontainer.json||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          else
            ALL=$(find images -maxdepth 2 -name "devcontainer.json" | sed 's|images/||;s|/devcontainer.json||' | sort)
            BEFORE="${{ github.event.before }}"
            if [[ "${{ github.ref }}" == refs/tags/* ]] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              SELECTED="$ALL"
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
              # Shared inputs (common Dockerfile, scripts, features, CI) affect every image
              if echo "$CHANGED" | grep -qE '^(images/Dockerfile|images/scripts/|features/|\.github/workflows/build\.yml)'; then
                SELECTED="$ALL"
              else
                SELECTED=$(echo "$CHANGED" | grep -oE '^images/[^/]+/' | sed 's|images/||;s|/||' | sort -u | while read -r d; do
                  [ -f "images/$d/devcontainer.json" ] && echo "$d"
                done)
              fi
            fi
            IMAGES=$(echo "$SELECTED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          # One immutable stamp per run, shared by the build and manifest jobs
          echo "stamp=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    needs: [changes, features]
    if: ${{ needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one image failing should not cancel the others
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine arch-specific image tags
        id: tags
        run: |
          ARCH="${{ matrix.platform }}"
          ARCH="${ARCH#linux/}"
          # Immutable <date>-<sha> tag so consumers can pin and roll back
          TAGS="latest-${ARCH},${{ needs.changes.outputs.stamp }}-${ARCH}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            # Strip leading 'v' to split semver parts
            V="${VERSION#v}"
            MAJOR="v${V%%.*}"
            MINOR_REST="${V#*.}"
            MINOR="v${V%%.*}.${MINOR_REST%%.*}"
            # Always add the full version tag
            TAGS="${TAGS},${VERSION}-${ARCH}"
            # Add minor tag only if it differs from full version (i.e., has patch)
            if [[ "$MINOR" != "$VERSION" && "$MINOR" != "v$V" ]]; then
              TAGS="${TAGS},${MINOR}-${ARCH}"
            fi
            # Add major tag only if it differs from minor
            if [[ "$MAJOR" != "$MINOR" && "$MAJOR" != "$VERSION" ]]; then
              TAGS="${TAGS},${MAJOR}-${ARCH}"
            fi
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.image }}
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: images/${{ matrix.image }}/devcontainer.json
          imageName: ${{ env.REGISTRY }}/${{ env.ORG }}/devcontainers/${{ matrix.image }}
          imageTag: ${{ steps.tags.outputs.tags }}
          cacheFrom: ${{ env.REGISTRY }}/${{ env.ORG }}/devcontainers/${{ matrix.image }}
          platform: ${{ matrix.platform }}
          push: always

  manifest:
    name: Publish multi-arch manifest (${{ matrix.image }})
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.ORG }}/devcontainers/${{ matrix.image }}"
          if docker buildx imagetools inspect "${IMAGE}:latest-amd64" &>/dev/null \
            && docker buildx imagetools inspect "${IMAGE}:latest-arm64" &>/dev/null; then
            docker buildx imagetools create \
              -t "${IMAGE}:latest" \
              "${IMAGE}:latest-amd64" \
              "${IMAGE}:latest-arm64"
            SHA_TAG="${{ needs.changes.outputs.stamp }}"
            docker buildx imagetools create \
              -t "${IMAGE}:${SHA_TAG}" \
              "${IMAGE}:${SHA_TAG}-amd64" \
              "${IMAGE}:${SHA_TAG}-arm64"
          else
            echo "Skipping manifest for ${{ matrix.image }}: one or both arch builds are missing"
          fi

      - name: Create version manifests
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.ORG }}/devcontainers/${{ matrix.image }}"
          VERSION="${{ github.ref_name }}"
          V="${VERSION#v}"
          MAJOR="v${V%%.*}"
          MINOR_REST="${V#*.}"
          MINOR="v${V%%.*}.${MINOR_REST%%.*}"

          # Only publish if both arch images exist
          if ! docker buildx imagetools inspect "${IMAGE}:${VERSION}-amd64" &>/dev/null \
            || ! docker buildx imagetools inspect "${IMAGE}:${VERSION}-arm64" &>/dev/null; then
            echo "Skipping version manifests for ${{ matrix.image }}: one or both arch builds are missing"
            exit 0
          fi

          # Always publish the full version tag
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          # Publish minor tag (v1.2) if it differs from full (v1.2.3)
          if [[ "$MINOR" != "$VERSION" && "$MINOR" != "v$V" ]]; then
            docker buildx imagetools create \
              -t "${IMAGE}:${MINOR}" \
              "${IMAGE}:${MINOR}-amd64" \
              "${IMAGE}:${MINOR}-arm64"
          fi

          # Publish major tag (v1) if it differs from minor
          if [[ "$MAJOR" != "$MINOR" && "$MAJOR" != "$VERSION" ]]; then
            docker buildx imagetools create \
              -t "${IMAGE}:${MAJOR}" \
              "${IMAGE}:${MAJOR}-amd64" \
              "${IMAGE}:${MAJOR}-arm64"
          fi
