name: PR Build and Smoke Test

on:
  pull_request:
    paths:
      - 'images/**'
      - 'features/**'
      - '.github/scripts/**'
      - '.github/workflows/pr-build.yml'

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Detect changed images
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          ALL=$(find images -maxdepth 2 -name devcontainer.json | sed 's|images/||;s|/devcontainer.json||' | sort)
          # Shared inputs (common Dockerfile, scripts, features, CI) affect every image
          if echo "$CHANGED" | grep -qE '^(images/Dockerfile|images/scripts/|features/|\.github/scripts/|\.github/workflows/pr-build\.yml)'; then
            SELECTED="$ALL"
          else
            SELECTED=$(echo "$CHANGED" | grep -oE '^images/[^/]+/' | sed 's|images/||;s|/||' | sort -u | while read -r d; do
              [ -f "images/$d/devcontainer.json" ] && echo "$d"
            done)
          fi
          echo "images=$(echo "$SELECTED" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test ${{ matrix.image }}
    needs: changes
    if: ${{ needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and smoke test ${{ matrix.image }} (amd64, no push)
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: images/${{ matrix.image }}/devcontainer.json
          imageName: ghcr.io/dever-labs/devcontainers/${{ matrix.image }}
          imageTag: pr-${{ github.event.pull_request.number }}
          push: never
          runCmd: bash .github/scripts/smoke-test.sh ${{ matrix.image }}
