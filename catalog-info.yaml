# Describes this repository in devhub (https://hub.dever.dk), dever-labs'
# developer portal. devhub's GitHub discovery reads this file from the
# default branch; docs come from docs/ (backstage.io/techdocs-ref).
#   devhub/install  how to get it (Install card), <channel>:<id>, comma-separated
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: dev-environments
  namespace: devtools
  title: Dev environments
  description: Shared devcontainer images and features, and containerized developer workstations.
  annotations:
    github.com/project-slug: dever-labs/devcontainers
spec:
  owner: group:devtools/engineering
  domain: domain:devtools/devtools
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: devcontainers
  namespace: devtools
  title: devcontainers
  description: >
    Pre-built devcontainer images (images/) for humans and AI coding agents,
    plus opt-in devcontainer features (features/src) under
    ghcr.io/dever-labs/devcontainers/features.
  annotations:
    github.com/project-slug: dever-labs/devcontainers
    backstage.io/techdocs-ref: dir:.
  tags: [devcontainer, docker]
spec:
  type: tool
  lifecycle: production
  owner: group:devtools/engineering
  system: system:devtools/dev-environments
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: devcontainer-dotnet-dev
  namespace: devtools
  title: dotnet-dev devcontainer image
  description: ghcr.io/dever-labs/devcontainers/dotnet-dev — .NET 10 SDK, Docker-outside-of-Docker, kubectl, Helm, k3d.
  annotations:
    github.com/project-slug: dever-labs/devcontainers
    backstage.io/source-location: url:https://github.com/dever-labs/devcontainers/tree/main/images/dotnet-dev
    devhub/install: docker:ghcr.io/dever-labs/devcontainers/dotnet-dev:latest
  links:
    - url: https://github.com/dever-labs/devcontainers/pkgs/container/devcontainers%2Fdotnet-dev
      title: Image on GHCR
    - url: https://github.com/dever-labs/devcontainers/blob/main/docs/dotnet-dev.md
      title: Image docs
spec:
  type: container-image
  lifecycle: production
  owner: group:devtools/engineering
  system: system:devtools/dev-environments
  dependsOn:
    - component:devtools/devx
---
